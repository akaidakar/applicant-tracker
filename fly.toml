# Fly.io: one machine running Django + the built React app, SQLite on a volume.
app = "applicant-tracker"
primary_region = "ams"

[env]
  DJANGO_DEBUG = "0"
  DJANGO_ALLOWED_HOSTS = "applicant-tracker.fly.dev"
  CSRF_TRUSTED_ORIGINS = "https://applicant-tracker.fly.dev"
  DATABASE_PATH = "/data/db.sqlite3"

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
